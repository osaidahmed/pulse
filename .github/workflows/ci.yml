name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
