[package]
name = "pulse-audit"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
pulse-core = { path = "../pulse-core" }
pulse-thresholds = { path = "../pulse-thresholds" }
pulse-syntax = { path = "../pulse-syntax" }
pulse-buildmeta = { path = "../pulse-buildmeta" }
pulse-imports = { path = "../pulse-imports" }
pulse-config = { path = "../pulse-config" }
pulse-corpus = { path = "../pulse-corpus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
tree-sitter = "0.25"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
pulse-testkit = { path = "../pulse-testkit" }
pulse-config = { path = "../pulse-config" }
pulse-thresholds = { path = "../pulse-thresholds" }
pulse-syntax = { path = "../pulse-syntax" }
pulse-buildmeta = { path = "../pulse-buildmeta" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
needless_pass_by_value = "allow"
implicit_hasher = "allow"
new_without_default = "allow"
format_push_string = "allow"
