[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
description = "Fast code smell detector for agent hooks"
license = "MIT"

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1.2"
tree-sitter-ruby = "0.23"
tree-sitter-objc = "3.0.2"
tree-sitter-tcl = { git = "https://github.com/tree-sitter-grammars/tree-sitter-tcl", rev = "8f11ac7" }
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-haskell = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
tree-sitter-lua = "0.5.0"
tree-sitter-r = "1.2.0"
tree-sitter-php = "0.24.2"
tree-sitter-cobol = { git = "https://github.com/osaidahmed/tree-sitter-cobol", rev = "99d6233" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "analysis"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
needless_pass_by_value = "allow"
implicit_hasher = "allow"
new_without_default = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
