[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
description = "Fast code smell detector for agent hooks"
license = "MIT"

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
