[profile.default]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
test-threads = "num-cpus"
fail-fast = false
retries = 1

[profile.release-test]
test-threads = "num-cpus"
fail-fast = false

[[profile.release-test.overrides]]
filter = "test(priors_sweep)"
slow-timeout = { period = "3600s", terminate-after = 2 }
